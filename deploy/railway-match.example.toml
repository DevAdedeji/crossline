# Preparation only; this file does not deploy a service.
# Supply reviewed secure configuration and obtain deployment authorization first.
[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @crossline/match build"

[deploy]
startCommand = "node apps/match/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
